<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Story Analysis Result</title>
<style>
body {
    font-family: Arial;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container {
    background:white;
    padding:30px;
    border-radius:10px;
    width:400px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}
h2 { text-align:center; }
p { margin:10px 0; }

.image-btn {
    display:block;
    margin-top:15px;
    width:100%;
    padding:10px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>
<div class="container">
    <h2>Story Analysis Result</h2>

    <p><strong>Story:</strong> {{ story }}</p>
    <p><strong>Sentiment:</strong> {{ sentiment }}</p>
    <p><strong>Positive Score:</strong> {{ positive }}</p>
    <p><strong>Negative Score:</strong> {{ negative }}</p>
    <p><strong>Neutral Score:</strong> {{ neutral }}</p>

    <button onclick="window.location.href='/images'" class="image-btn">
        Submit another story
    </button>
</div>
</body>
</html>
