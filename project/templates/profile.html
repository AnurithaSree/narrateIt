<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background-color: #f9f9f9;
}

/* BACK BUTTON */
.back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 28px;
    text-decoration: none;
    color: #333;
    background: white;
    border-radius: 50%;
    padding: 8px 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: 0.2s;
}

.back-btn:hover {
    background: #4CAF50;
    color: white;
}

/* PROFILE HEADER */
.profile-header {
    margin-top: 60px;
}

.profile-circle {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    color: white;
    font-size: 28px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
}

/* GALLERY */
.gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 30px;
}

.story-card {
    margin: 10px;
}

.story-card img {
    width: 200px;
    border-radius: 8px;
    transition: 0.2s;
}

.story-card img:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<!-- ✅ BACK BUTTON -->
<a href="{{ url_for('images') }}" class="back-btn">
    &#8592;
</a>

<!-- PROFILE HEADER -->
<div class="profile-header">
    <div class="profile-circle" id="profileCircle">
        {{ username[0] | upper }}
    </div>

    <h2>{{ username }}</h2>
    <h3>Total Stories: {{ total }}</h3>
</div>

<!-- STORIES -->
<div class="gallery">
{% for story in stories %}
    <div class="story-card">
        <a href="{{ url_for('view_story', story_id=story.id) }}">
            <img src="{{ url_for('static', filename=story.image) }}">
        </a>
    </div>
{% endfor %}
</div>

<script>
// Dynamic color
function getColor(letter) {
    const colors = [
        "#e74c3c",
        "#3498db",
        "#2ecc71",
        "#9b59b6",
        "#f39c12",
        "#1abc9c",
        "#d35400",
        "#34495e"
    ];

    return colors[letter.charCodeAt(0) % colors.length];
}

let username = "{{ username }}";
let firstLetter = username.charAt(0).toUpperCase();

let profileCircle = document.getElementById("profileCircle");
profileCircle.style.backgroundColor = getColor(firstLetter);
</script>

</body>
</html>
