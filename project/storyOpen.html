<!DOCTYPE html>
<html>
<body>

<style>
h2 {
    text-align: center;
    margin-top: 50px;
}

/* BACK BUTTON */
.back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 28px;
    text-decoration: none;
    color: #333;
    background: white;
    border-radius: 50%;
    padding: 8px 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: 0.2s;
}

.back-btn:hover {
    background: #4CAF50;
    color: white;
}
</style>

<h2>Your Story</h2>

<img src="{{ url_for('static', filename=image) }}" width="300">

<p>{{ text }}</p>
<p>Sentiment: {{ sentiment }}</p>

<!-- ✅ BACK BUTTON -->
<a href="{{ url_for('profile') }}" class="back-btn">
    &#8592;
</a>

</body>
</html>
